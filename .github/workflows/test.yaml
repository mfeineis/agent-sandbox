name: "CI - Validate And Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  AGENT_SANDBOX_BASEIMAGE: ghcr.io/${{ github.repository }}
  DEVCONTAINER_CLI: 0.87.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - base
          - claude-code
        baseImage:
          - ${{ env.AGENT_SANDBOX_BASEIMAGE }}
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI }}

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - base
          - claude-code
        baseImage:
          - ${{ env.AGENT_SANDBOX_BASEIMAGE }}
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI }}

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} -i ${{ matrix.baseImage }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI }}

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
