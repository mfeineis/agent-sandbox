name: CLI unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Syntax and internal smoke checks
        run: |
          /bin/sh -n ./firebreak
          /bin/sh ./firebreak --self-test
      - name: POSIX shell unit tests
        run: /bin/sh tests-cli/test_units.sh
      - name: Offline SSH recovery test (mocked guest)
        run: /bin/sh tests-cli/test_ssh_recovery.sh
      - name: Git boundary tests (Python standard library only)
        run: python -m unittest discover -s tests-cli/ -p 'test_*.py' -v
