name: "Release devcontainer baseimage, features & Generate Documentation"
on:
  push:
    tags:
    - 'v*'
  # workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEVCONTAINER_CLI: 0.87.0

jobs:
  deploy:
    # if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get tag name
        run: echo "TAG=$(echo "${{ github.ref }}" | grep -oP 'refs/tags/v\K(.+)')" >> $GITHUB_ENV

      - name: Check that tag is set
        run: if [ -z "${{ env.TAG }}" ]; then { echo "Only releasing with tag!"; exit 2; }; fi

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI }}

      - name: "Publish Baseimage to ghcr.io"
        env:
          IMAGE_BASE_NAME: "${{ env.REGISTRY }}/${{ github.repository }}"
        run: |
          set -e

          MINOR="$(echo "${{ env.TAG }}" | sed --regexp-extended 's/^([0-9]+\.[0-9]+)\.[0-9]+/\1/')"
          devcontainer build --push --no-cache=true --workspace-folder=src/agent-sandbox --image-name="${{ env.IMAGE_BASE_NAME }}:latest" --image-name="${{ env.IMAGE_BASE_NAME }}:$MINOR" --image-name="${{ env.IMAGE_BASE_NAME }}:${{ env.TAG }}" --log-level=debug
